AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Academic Task Manager - AWS Academy lab deployment

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  LabRoleArn:
    Type: String
    Default: arn:aws:iam::081045266942:role/LabRole
  DemoUserId:
    Type: String
    Default: lab-demo-user

Globals:
  Function:
    CodeUri: src/
    Runtime: nodejs24.x
    Architectures: [x86_64]
    Handler: handlers/getTasks.handler
    MemorySize: 256
    Timeout: 30
    Environment:
      Variables:
        REGION: !Ref AWS::Region
        TASKS_TABLE: !Ref TasksTable
        USERS_TABLE: !Ref UsersTable
        ORGANIZATIONS_TABLE: !Ref OrganizationsTable
        SCHOOLS_TABLE: !Ref SchoolsTable
        CLASSES_TABLE: !Ref ClassesTable
        ENROLLMENTS_TABLE: !Ref EnrollmentsTable
        SNS_TOPIC_ARN: !Ref ReminderTopic
        DEFAULT_USER_ID: !Ref DemoUserId
        DEFAULT_USER_EMAIL: lab-demo@example.invalid

Resources:
  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub academic-tasks-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
        - { AttributeName: GSI3PK, AttributeType: S }
        - { AttributeName: GSI3SK, AttributeType: S }
        - { AttributeName: GSI4PK, AttributeType: S }
        - { AttributeName: GSI4SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1-TasksByDeadline
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI2-TasksByModule
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI3-TasksByStatus
          KeySchema:
            - { AttributeName: GSI3PK, KeyType: HASH }
            - { AttributeName: GSI3SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI4-RemindersByTask
          KeySchema:
            - { AttributeName: GSI4PK, KeyType: HASH }
            - { AttributeName: GSI4SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - { Key: Project, Value: academic-task-manager }
        - { Key: Environment, Value: !Ref Environment }

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub academic-task-users-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: user_id, AttributeType: S }
        - { AttributeName: email, AttributeType: S }
      KeySchema:
        - { AttributeName: user_id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - { AttributeName: email, KeyType: HASH }
          Projection: { ProjectionType: ALL }
      Tags:
        - { Key: Project, Value: academic-task-manager }

  OrganizationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub academic-organizations-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: organization_id, AttributeType: S }
      KeySchema:
        - { AttributeName: organization_id, KeyType: HASH }
      Tags:
        - { Key: Project, Value: academic-task-manager }

  SchoolsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub academic-schools-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: school_id, AttributeType: S }
      KeySchema:
        - { AttributeName: school_id, KeyType: HASH }
      Tags:
        - { Key: Project, Value: academic-task-manager }

  ClassesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub academic-classes-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: class_id, AttributeType: S }
      KeySchema:
        - { AttributeName: class_id, KeyType: HASH }
      Tags:
        - { Key: Project, Value: academic-task-manager }

  EnrollmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub academic-user-classes-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: user_id, AttributeType: S }
        - { AttributeName: class_id, AttributeType: S }
      KeySchema:
        - { AttributeName: user_id, KeyType: HASH }
        - { AttributeName: class_id, KeyType: RANGE }
      Tags:
        - { Key: Project, Value: academic-task-manager }

  ReminderTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub academic-reminders-${Environment}
      DisplayName: Academic Task Reminders
      Tags:
        - { Key: Project, Value: academic-task-manager }

  TaskManagerApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub academic-task-manager-${Environment}
      StageName: !Ref Environment
      EndpointConfiguration: REGIONAL
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Api-Key,Authorization'"
        AllowOrigin: "'*'"

  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn: TaskManagerApiStage
    Properties:
      Name: !Sub academic-task-manager-key-${Environment}
      Description: Browser demo key for the Academic Task Manager lab
      Enabled: true

  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: TaskManagerApiStage
    Properties:
      UsagePlanName: !Sub academic-task-manager-usage-${Environment}
      ApiStages:
        - ApiId: !Ref TaskManagerApi
          Stage: !Ref Environment
      Throttle:
        RateLimit: 10
        BurstLimit: 20
      Quota:
        Limit: 10000
        Period: MONTH

  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlan

  GetTasksFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/getTasks.handler
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /tasks, Method: GET, Auth: { ApiKeyRequired: true } }

  CreateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/createTask.handler
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /tasks, Method: POST, Auth: { ApiKeyRequired: true } }

  UpdateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/updateTask.handler
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: '/tasks/{taskId}', Method: PUT, Auth: { ApiKeyRequired: true } }

  DeleteTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/deleteTask.handler
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: '/tasks/{taskId}', Method: DELETE, Auth: { ApiKeyRequired: true } }

  GetModulesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/modules.getModules
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /modules, Method: GET, Auth: { ApiKeyRequired: true } }

  CreateModuleFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/modules.createModule
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /modules, Method: POST, Auth: { ApiKeyRequired: true } }

  UpdateModuleFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/modules.updateModule
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: '/modules/{moduleId}', Method: PUT, Auth: { ApiKeyRequired: true } }

  DeleteModuleFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/modules.deleteModule
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: '/modules/{moduleId}', Method: DELETE, Auth: { ApiKeyRequired: true } }

  GetDashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/getDashboard.handler
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /dashboard, Method: GET, Auth: { ApiKeyRequired: true } }

  AIPrioritizeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/labAi.prioritize
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /ai/prioritize, Method: POST, Auth: { ApiKeyRequired: true } }

  AIBreakdownFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/labAi.breakdown
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: '/ai/breakdown/{taskId}', Method: POST, Auth: { ApiKeyRequired: true } }

  AgentInvokeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/labAi.agent
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /ai/agent, Method: POST, Auth: { ApiKeyRequired: true } }

  ReminderCheckerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/reminderCheckerLab.handler
      Events:
        ScheduledCheck:
          Type: Schedule
          Properties:
            Name: !Sub academic-task-reminder-check-${Environment}
            Description: Check due academic task reminders every 15 minutes
            Schedule: rate(15 minutes)
            Enabled: true

  GetProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/account.getProfile
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /account, Method: GET, Auth: { ApiKeyRequired: true } }

  UpsertProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/account.upsertProfile
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /account, Method: PUT, Auth: { ApiKeyRequired: true } }

  InstitutionCatalogFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/catalog.organizations
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /organizations, Method: GET, Auth: { ApiKeyRequired: true } }

  SchoolsCatalogFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/catalog.schools
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /schools, Method: GET, Auth: { ApiKeyRequired: true } }

  ClassesCatalogFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/catalog.classes
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /classes, Method: GET, Auth: { ApiKeyRequired: true } }

  EnrollmentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/enrollments.list
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /account/classes, Method: GET, Auth: { ApiKeyRequired: true } }

  EnrollFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/enrollments.enroll
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /account/classes, Method: POST, Auth: { ApiKeyRequired: true } }

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${TaskManagerApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
  ApiKeyId:
    Description: API Gateway key ID; retrieve its value with get-api-key
    Value: !Ref ApiKey
  TasksTableName:
    Value: !Ref TasksTable
  UsersTableName:
    Value: !Ref UsersTable
  ReminderTopicArn:
    Value: !Ref ReminderTopic
  ReminderFunctionName:
    Value: !Ref ReminderCheckerFunction
