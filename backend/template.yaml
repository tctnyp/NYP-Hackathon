AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Academic Task Manager - AWS Academy lab deployment with Cognito authentication

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  AdminUsername:
    Type: String
    Default: admin
    AllowedValues: [admin]
    Description: The only Cognito username authorized for administrator access
  LabRoleArn:
    Type: String
    Default: arn:aws:iam::081045266942:role/LabRole
  FrontendUrl:
    Type: String
    Default: https://nypxaws.tancheetiong.com
    Description: Frontend URL for OAuth callbacks
  GoogleOAuthClientId:
    Type: String
    Default: ''
    Description: Optional Google OAuth 2.0 Client ID for social sign-in and account linking
  GoogleOAuthClientSecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: Optional Google OAuth 2.0 Client Secret for social sign-in and account linking
  GoogleOAuthRedirectUri:
    Type: String
    Default: https://nypxaws.tancheetiong.com/account/settings
    Description: Authenticated SPA route that completes Google account linking
  EnableGoogleCalendarSync:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Explicitly enable separate Google Calendar consent and synchronization
  GoogleCalendarOAuthClientId:
    Type: String
    Default: ''
    Description: OAuth client ID used only for explicit Google Calendar consent
  GoogleCalendarOAuthClientSecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: OAuth client secret used only by Google Calendar synchronization Lambdas
  GoogleCalendarOAuthRedirectUri:
    Type: String
    Default: https://nypxaws.tancheetiong.com/account/settings
    AllowedPattern: '^https://\S+/account/settings$|^http://localhost(:[0-9]+)?/account/settings$'
    Description: Authenticated SPA route that completes Google Calendar consent
  GoogleCalendarEncryptionKeyBase64:
    Type: String
    Default: ''
    NoEcho: true
    AllowedPattern: '^$|^[A-Za-z0-9+/]{43}=$'
    ConstraintDescription: Must be empty or canonical base64 encoding of exactly 32 bytes
    Description: Random 32-byte base64 key for application-layer AES-256-GCM refresh-token encryption
  GoogleCalendarRevokeOnDisable:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Revoke the Google grant on disable only when Calendar uses a dedicated Google Cloud project
  DiscordOAuthClientId:
    Type: String
    Default: ''
    Description: Optional Discord OAuth 2.0 Client ID for account linking
  DiscordOAuthClientSecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: Optional Discord OAuth 2.0 Client Secret for account linking
  DiscordOAuthRedirectUri:
    Type: String
    Default: https://nypxaws.tancheetiong.com/account/settings
    Description: Frontend handoff used by Discord account linking and OIDC login
  DiscordOIDCClientId:
    Type: String
    Default: ''
    Description: Public OIDC client identifier shared by Cognito and the Discord bridge
  DiscordOIDCClientSecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: Private client secret shared by Cognito and the Discord OIDC bridge
  DiscordOIDCPrivateKeyBase64:
    Type: String
    Default: ''
    NoEcho: true
    Description: Base64-encoded PKCS8 RSA private key used to sign OIDC ID tokens
  DiscordOIDCKeyId:
    Type: String
    Default: discord-oidc-1
    Description: Public key identifier exposed by the bridge JWKS endpoint
  DiscordOIDCScopes:
    Type: String
    Default: openid profile email
    Description: Scopes supported by the Discord OIDC identity bridge
  EnableDiscordCognito:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Explicitly enable the Cognito Discord provider after bridge discovery and JWKS are reachable

Conditions:
  HasGoogleOAuth: !And
    - !Not [!Equals [!Ref GoogleOAuthClientId, '']]
    - !Not [!Equals [!Ref GoogleOAuthClientSecret, '']]
  HasGoogleCalendarSync: !And
    - !Equals [!Ref EnableGoogleCalendarSync, 'true']
    - !Not [!Equals [!Ref GoogleCalendarOAuthClientId, '']]
    - !Not [!Equals [!Ref GoogleCalendarOAuthClientSecret, '']]
    - !Not [!Equals [!Ref GoogleCalendarOAuthRedirectUri, '']]
    - !Not [!Equals [!Ref GoogleCalendarEncryptionKeyBase64, '']]
  HasDiscordBridgeConfiguration: !And
    - !Not [!Equals [!Ref DiscordOAuthClientId, '']]
    - !Not [!Equals [!Ref DiscordOAuthClientSecret, '']]
    - !Not [!Equals [!Ref DiscordOAuthRedirectUri, '']]
    - !Not [!Equals [!Ref DiscordOIDCClientId, '']]
    - !Not [!Equals [!Ref DiscordOIDCClientSecret, '']]
    - !Not [!Equals [!Ref DiscordOIDCPrivateKeyBase64, '']]
  HasDiscordOIDC: !And
    - !Condition HasDiscordBridgeConfiguration
    - !Equals [!Ref EnableDiscordCognito, 'true']

Globals:
  Function:
    CodeUri: src/
    Runtime: nodejs24.x
    Architectures: [x86_64]
    Handler: handlers/getTasks.handler
    MemorySize: 256
    Timeout: 30
    Environment:
      Variables:
        REGION: !Ref AWS::Region
        ENVIRONMENT: !Ref Environment
        ADMIN_USERNAME: !Ref AdminUsername
        TASKS_TABLE: !Ref TasksTable
        USERS_TABLE: !Ref UsersTable
        CALENDAR_CONNECTIONS_TABLE: !Ref GoogleCalendarConnectionsTable
        ORGANIZATIONS_TABLE: !Ref OrganizationsTable
        SCHOOLS_TABLE: !Ref SchoolsTable
        CLASSES_TABLE: !Ref ClassesTable
        ENROLLMENTS_TABLE: !Ref EnrollmentsTable
        SNS_TOPIC_ARN: !Ref ReminderTopic

Resources:
  # Cognito PostConfirmation trigger Lambda (created before UserPool to break circular dependency)
  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/postConfirmation.handler
      Environment:
        Variables:
          REGION: !Ref AWS::Region
          USERS_TABLE: !Ref UsersTable

  PostConfirmationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PostConfirmationFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  # Cognito User Pool for authentication
  UserPool:
    Type: AWS::Cognito::UserPool
    DependsOn: PostConfirmationInvokePermission
    Properties:
      UserPoolName: !Sub academic-task-manager-${Environment}
      AliasAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
      LambdaConfig:
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub academic-task-manager-client-${Environment}
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      CallbackURLs:
        - !Sub ${FrontendUrl}/auth/callback
        - http://localhost:3000/auth/callback
      LogoutURLs:
        - !Ref FrontendUrl
        - http://localhost:3000
      SupportedIdentityProviders:
        - COGNITO
        - !If [HasGoogleOAuth, !Ref GoogleIdentityProvider, !Ref 'AWS::NoValue']
        - !If [HasDiscordOIDC, !Ref DiscordIdentityProvider, !Ref 'AWS::NoValue']
      AllowedOAuthFlowsUserPoolClient: true
      PreventUserExistenceErrors: ENABLED
      RefreshTokenValidity: 30
      AccessTokenValidity: 60
      IdTokenValidity: 60
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub academic-task-mgr-${Environment}-${AWS::AccountId}
      UserPoolId: !Ref UserPool

  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admins
      Description: Administrators with full system access
      UserPoolId: !Ref UserPool
      Precedence: 1

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogleOAuth
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleOAuthClientId
        client_secret: !Ref GoogleOAuthClientSecret
        authorize_scopes: profile email openid
      AttributeMapping:
        email: email
        name: name

  # Discord exposes OAuth 2.0 but not Cognito-compatible OIDC tokens directly.
  # Configure an OIDC bridge that federates Discord and emits standard OIDC claims.
  DiscordIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasDiscordOIDC
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Discord
      ProviderType: OIDC
      ProviderDetails:
        oidc_issuer: !Sub https://${TaskManagerApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/oidc/discord
        client_id: !Ref DiscordOIDCClientId
        client_secret: !Ref DiscordOIDCClientSecret
        authorize_scopes: !Ref DiscordOIDCScopes
        attributes_request_method: GET
      AttributeMapping:
        email: email
        name: name
        preferred_username: preferred_username
        picture: picture

  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub academic-tasks-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
        - { AttributeName: GSI3PK, AttributeType: S }
        - { AttributeName: GSI3SK, AttributeType: S }
        - { AttributeName: GSI4PK, AttributeType: S }
        - { AttributeName: GSI4SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1-TasksByDeadline
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI2-TasksByModule
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI3-TasksByStatus
          KeySchema:
            - { AttributeName: GSI3PK, KeyType: HASH }
            - { AttributeName: GSI3SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI4-RemindersByTask
          KeySchema:
            - { AttributeName: GSI4PK, KeyType: HASH }
            - { AttributeName: GSI4SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      Tags:
        - { Key: Project, Value: academic-task-manager }
        - { Key: Environment, Value: !Ref Environment }

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub academic-task-users-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: user_id, AttributeType: S }
        - { AttributeName: email, AttributeType: S }
      KeySchema:
        - { AttributeName: user_id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - { AttributeName: email, KeyType: HASH }
          Projection: { ProjectionType: ALL }
      Tags:
        - { Key: Project, Value: academic-task-manager }

  GoogleCalendarConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub academic-google-calendar-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: user_id, AttributeType: S }
      KeySchema:
        - { AttributeName: user_id, KeyType: HASH }
      SSESpecification:
        SSEEnabled: true
      Tags:
        - { Key: Project, Value: academic-task-manager }
        - { Key: Purpose, Value: encrypted-google-calendar-credentials }

  DiscordOIDCSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub academic-discord-oidc-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      Tags:
        - { Key: Project, Value: academic-task-manager }
        - { Key: Purpose, Value: discord-oidc-transactions }

  OrganizationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub academic-organizations-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: organization_id, AttributeType: S }
      KeySchema:
        - { AttributeName: organization_id, KeyType: HASH }
      Tags:
        - { Key: Project, Value: academic-task-manager }

  SchoolsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub academic-schools-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: school_id, AttributeType: S }
      KeySchema:
        - { AttributeName: school_id, KeyType: HASH }
      Tags:
        - { Key: Project, Value: academic-task-manager }

  ClassesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub academic-classes-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: class_id, AttributeType: S }
      KeySchema:
        - { AttributeName: class_id, KeyType: HASH }
      Tags:
        - { Key: Project, Value: academic-task-manager }

  EnrollmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub academic-user-classes-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: user_id, AttributeType: S }
        - { AttributeName: class_id, AttributeType: S }
      KeySchema:
        - { AttributeName: user_id, KeyType: HASH }
        - { AttributeName: class_id, KeyType: RANGE }
      Tags:
        - { Key: Project, Value: academic-task-manager }

  GoogleCalendarSyncFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub academic-google-calendar-sync-failures-${Environment}
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
      Tags:
        - { Key: Project, Value: academic-task-manager }
        - { Key: Purpose, Value: google-calendar-sync-failure-replay }

  GoogleCalendarSyncFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub academic-google-calendar-sync-failures-${Environment}
      AlarmDescription: Calendar stream records exhausted automatic Lambda retries and require replay
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt GoogleCalendarSyncFailureQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ReminderTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub academic-reminders-${Environment}
      DisplayName: Academic Task Reminders
      Tags:
        - { Key: Project, Value: academic-task-manager }

  TaskManagerApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub academic-task-manager-${Environment}
      StageName: !Ref Environment
      EndpointConfiguration: REGIONAL
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,PATCH,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  DiscordOIDCFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/discordOidc.handler
      Environment:
        Variables:
          DISCORD_OIDC_TABLE: !Ref DiscordOIDCSessionsTable
          DISCORD_OIDC_CLIENT_ID: !Ref DiscordOIDCClientId
          DISCORD_OIDC_CLIENT_SECRET: !Ref DiscordOIDCClientSecret
          DISCORD_OIDC_PRIVATE_KEY_BASE64: !Ref DiscordOIDCPrivateKeyBase64
          DISCORD_OIDC_KEY_ID: !Ref DiscordOIDCKeyId
          DISCORD_OAUTH_CLIENT_ID: !Ref DiscordOAuthClientId
          DISCORD_OAUTH_CLIENT_SECRET: !Ref DiscordOAuthClientSecret
          DISCORD_OAUTH_REDIRECT_URI: !Ref DiscordOAuthRedirectUri
          COGNITO_IDP_RESPONSE_URI: !Sub https://academic-task-mgr-${Environment}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse
          APP_URL: !Ref FrontendUrl
      Events:
        Discovery:
          Type: Api
          Properties:
            RestApiId: !Ref TaskManagerApi
            Path: /oidc/discord/.well-known/openid-configuration
            Method: GET
            Auth: { Authorizer: NONE }
        Jwks:
          Type: Api
          Properties:
            RestApiId: !Ref TaskManagerApi
            Path: /oidc/discord/jwks.json
            Method: GET
            Auth: { Authorizer: NONE }
        Authorize:
          Type: Api
          Properties:
            RestApiId: !Ref TaskManagerApi
            Path: /oidc/discord/authorize
            Method: GET
            Auth: { Authorizer: NONE }
        Callback:
          Type: Api
          Properties:
            RestApiId: !Ref TaskManagerApi
            Path: /oidc/discord/callback
            Method: POST
            Auth: { Authorizer: NONE }
        Token:
          Type: Api
          Properties:
            RestApiId: !Ref TaskManagerApi
            Path: /oidc/discord/token
            Method: POST
            Auth: { Authorizer: NONE }
        UserInfo:
          Type: Api
          Properties:
            RestApiId: !Ref TaskManagerApi
            Path: /oidc/discord/userinfo
            Method: GET
            Auth: { Authorizer: NONE }

  GetTasksFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/getTasks.handler
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /tasks, Method: GET }

  CreateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/createTask.handler
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /tasks, Method: POST }

  UpdateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/updateTask.handler
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: '/tasks/{taskId}', Method: PUT }

  DeleteTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/deleteTask.handler
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: '/tasks/{taskId}', Method: DELETE }

  GetGoogleCalendarStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/googleCalendar.getStatus
      Environment:
        Variables:
          GOOGLE_CALENDAR_SYNC_ENABLED: !If [HasGoogleCalendarSync, 'true', 'false']
          GOOGLE_CALENDAR_OAUTH_CLIENT_ID: !Ref GoogleCalendarOAuthClientId
          GOOGLE_CALENDAR_OAUTH_REDIRECT_URI: !Ref GoogleCalendarOAuthRedirectUri
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /calendar/google, Method: GET }

  UpdateGoogleCalendarFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/googleCalendar.update
      Timeout: 60
      Environment:
        Variables:
          GOOGLE_CALENDAR_SYNC_ENABLED: !If [HasGoogleCalendarSync, 'true', 'false']
          GOOGLE_CALENDAR_OAUTH_CLIENT_ID: !Ref GoogleCalendarOAuthClientId
          GOOGLE_CALENDAR_OAUTH_CLIENT_SECRET: !Ref GoogleCalendarOAuthClientSecret
          GOOGLE_CALENDAR_OAUTH_REDIRECT_URI: !Ref GoogleCalendarOAuthRedirectUri
          GOOGLE_CALENDAR_ENCRYPTION_KEY_BASE64: !Ref GoogleCalendarEncryptionKeyBase64
          GOOGLE_CALENDAR_REVOKE_ON_DISABLE: !Ref GoogleCalendarRevokeOnDisable
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /calendar/google, Method: PUT }

  GoogleCalendarSyncWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/googleCalendarWorker.handler
      Timeout: 120
      Environment:
        Variables:
          GOOGLE_CALENDAR_SYNC_ENABLED: !If [HasGoogleCalendarSync, 'true', 'false']
          GOOGLE_CALENDAR_OAUTH_CLIENT_ID: !Ref GoogleCalendarOAuthClientId
          GOOGLE_CALENDAR_OAUTH_CLIENT_SECRET: !Ref GoogleCalendarOAuthClientSecret
          GOOGLE_CALENDAR_OAUTH_REDIRECT_URI: !Ref GoogleCalendarOAuthRedirectUri
          GOOGLE_CALENDAR_ENCRYPTION_KEY_BASE64: !Ref GoogleCalendarEncryptionKeyBase64
          GOOGLE_CALENDAR_REVOKE_ON_DISABLE: !Ref GoogleCalendarRevokeOnDisable
      Events:
        TaskChanges:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt TasksTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumRetryAttempts: 5
            BisectBatchOnFunctionError: true
            FunctionResponseTypes:
              - ReportBatchItemFailures
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination: !GetAtt GoogleCalendarSyncFailureQueue.Arn
            FilterCriteria:
              Filters:
                - Pattern: '{ "dynamodb": { "NewImage": { "entity_type": { "S": ["TASK"] } } } }'
                - Pattern: '{ "dynamodb": { "OldImage": { "entity_type": { "S": ["TASK"] } } } }'
        ScheduledReconciliation:
          Type: Schedule
          Properties:
            Name: !Sub academic-google-calendar-reconcile-${Environment}
            Description: Repair Google Calendar task events and retry pending disable cleanup
            Schedule: rate(15 minutes)
            Enabled: true

  GetModulesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/modules.getModules
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /modules, Method: GET }

  CreateModuleFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/modules.createModule
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /modules, Method: POST }

  UpdateModuleFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/modules.updateModule
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: '/modules/{moduleId}', Method: PUT }

  DeleteModuleFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/modules.deleteModule
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: '/modules/{moduleId}', Method: DELETE }

  GetDashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/getDashboard.handler
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /dashboard, Method: GET }

  AIPrioritizeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/labAi.prioritize
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /ai/prioritize, Method: POST }

  AIBreakdownFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/labAi.breakdown
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: '/ai/breakdown/{taskId}', Method: POST }

  AgentInvokeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/labAi.agent
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /ai/agent, Method: POST }

  ReminderCheckerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/reminderCheckerLab.handler
      Events:
        ScheduledCheck:
          Type: Schedule
          Properties:
            Name: !Sub academic-task-reminder-check-${Environment}
            Description: Check due academic task reminders every 15 minutes
            Schedule: rate(15 minutes)
            Enabled: true

  GetProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/account.getProfile
      Environment:
        Variables:
          GOOGLE_OAUTH_CLIENT_ID: !Ref GoogleOAuthClientId
          GOOGLE_OAUTH_CLIENT_SECRET: !Ref GoogleOAuthClientSecret
          GOOGLE_OAUTH_REDIRECT_URI: !Ref GoogleOAuthRedirectUri
          DISCORD_OAUTH_CLIENT_ID: !Ref DiscordOAuthClientId
          DISCORD_OAUTH_CLIENT_SECRET: !Ref DiscordOAuthClientSecret
          DISCORD_OAUTH_REDIRECT_URI: !Ref DiscordOAuthRedirectUri
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /account, Method: GET }

  UpsertProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/account.upsertProfile
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          GOOGLE_OAUTH_CLIENT_ID: !Ref GoogleOAuthClientId
          GOOGLE_OAUTH_CLIENT_SECRET: !Ref GoogleOAuthClientSecret
          GOOGLE_OAUTH_REDIRECT_URI: !Ref GoogleOAuthRedirectUri
          DISCORD_OAUTH_CLIENT_ID: !Ref DiscordOAuthClientId
          DISCORD_OAUTH_CLIENT_SECRET: !Ref DiscordOAuthClientSecret
          DISCORD_OAUTH_REDIRECT_URI: !Ref DiscordOAuthRedirectUri
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /account, Method: PUT }

  InstitutionCatalogFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/catalog.organizations
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /organizations, Method: GET }

  SchoolsCatalogFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/catalog.schools
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /schools, Method: GET }

  ClassesCatalogFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/catalog.classes
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /classes, Method: GET }

  EnrollmentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/enrollments.list
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /account/classes, Method: GET }

  EnrollFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/enrollments.enroll
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /account/classes, Method: POST }

  # Admin functions - require Admins group membership
  AdminListUsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/admin.listUsers
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: /admin/users, Method: GET }

  AdminManageUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LabRoleArn
      Handler: handlers/admin.manageUser
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
      Events:
        ApiEvent:
          Type: Api
          Properties: { RestApiId: !Ref TaskManagerApi, Path: '/admin/users/{username}', Method: PATCH }

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${TaskManagerApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
  CognitoDomain:
    Description: Cognito hosted UI domain (hostname only)
    Value: !Sub academic-task-mgr-${Environment}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com
  GoogleOAuthEnabled:
    Description: Whether Google OAuth is configured
    Value: !If [HasGoogleOAuth, 'true', 'false']
  GoogleCalendarSyncEnabled:
    Description: Whether separate Google Calendar synchronization is fully configured
    Value: !If [HasGoogleCalendarSync, 'true', 'false']
  GoogleCalendarConnectionsTableName:
    Value: !Ref GoogleCalendarConnectionsTable
  GoogleCalendarSyncFailureQueueUrl:
    Value: !Ref GoogleCalendarSyncFailureQueue
  DiscordOIDCIssuerUrl:
    Description: Public issuer URL for the self-hosted Discord OIDC bridge
    Value: !Sub https://${TaskManagerApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/oidc/discord
  DiscordOAuthEnabled:
    Description: Whether Discord Cognito login is fully configured
    Value: !If [HasDiscordOIDC, 'true', 'false']
  TasksTableName:
    Value: !Ref TasksTable
  UsersTableName:
    Value: !Ref UsersTable
  ReminderTopicArn:
    Value: !Ref ReminderTopic
  ReminderFunctionName:
    Value: !Ref ReminderCheckerFunction
